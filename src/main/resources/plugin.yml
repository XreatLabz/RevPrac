name: RevPrac
version: '${version}'
main: io.github.xreatlabz.revprac.RevPracPlugin
description: Minecraft practice core plugin for Modern Paper 1.21.11.
authors: [XreatLabz]
website: https://github.com/XreatLabz/RevPrac
api-version: '1.21.11'
commands:
  revprac:
    description: RevPrac admin setup commands.
    usage: /revprac <arena|kit> ...
    permission: revprac.admin
    permission-message: You do not have permission to use this command.
  duel:
    description: RevPrac duel request, accept, deny, cancel, spectate, and forfeit commands.
    usage: /duel <player> <arena> <kit>|request <player> <arena> <kit>|accept <player>|deny <player>|cancel <player>|spectate <player>|forfeit
    permission: revprac.duel
    permission-message: You do not have permission to use this command.
permissions:
  revprac.admin:
    description: Allows RevPrac arena and kit setup commands.
    default: op
  revprac.duel:
    description: Allows RevPrac duel and spectate commands.
    default: true
